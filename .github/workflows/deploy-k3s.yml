name: build-and-deploy

on:
  push:
    branches: [main]

concurrency:
  group: organicsr-deploy-main
  cancel-in-progress: false

env:
  REGISTRY: registry.stoegerer-home.cloud
  IMAGE: registry.stoegerer-home.cloud/organicsr
  KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  NAMESPACE: organicsr
  PUBLIC_URL: https://chemie.stoegerer-home.cloud

jobs:
  deploy:
    runs-on: [self-hosted, organicsr]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image-Tag = Git-SHA
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Registry-Login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Image bauen
        # GIT_SHA als Build-Arg bustet den Frontend-Layer-Cache -> das Frontend wird
        # bei jedem Commit frisch gegen den ausgecheckten Quellstand gebaut.
        run: docker build --build-arg GIT_SHA="$TAG" -t "$IMAGE:$TAG" .

      # Startet das FRISCH gebaute Image und prueft, ob es ueberhaupt hochkommt und
      # der Login funktioniert. Faengt Import-/Boot-Crashes ab (z.B. fehlendes tzdata,
      # das die App beim Import killte) BEVOR ein kaputtes Image gepusht/deployt wird.
      - name: Smoke-Test (Image startet & Login funktioniert)
        run: |
          set -euo pipefail
          CID=$(docker run -d \
            -e SR_DB_PATH=/tmp/smoke.db \
            -e ADMIN_USER=smoke -e ADMIN_PASSWORD=smoke-pass-123 \
            -e AUTH_COOKIE_SECURE=0 \
            -p 18080:8000 "$IMAGE:$TAG")
          cleanup() { echo "--- Container-Logs ---"; docker logs "$CID" 2>&1 | tail -50 || true; docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # Auf /healthz warten: antwortet der Import crasht, kommt uvicorn nie hoch -> Timeout -> Fehler.
          up=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then up=1; break; fi
            sleep 2
          done
          [ -n "$up" ] || { echo "FEHLER: App wurde nicht gesund (Boot-Crash?)"; exit 1; }
          # Login + TZ-/DB-/Kartenpipeline-abhaengiger Endpoint muessen 200 liefern.
          curl -fsS -c /tmp/ck.txt -X POST http://127.0.0.1:18080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke","password":"smoke-pass-123"}' >/dev/null
          code=$(curl -s -b /tmp/ck.txt -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18080/api/stats?module=organic')
          [ "$code" = "200" ] || { echo "FEHLER: /api/stats lieferte $code statt 200"; exit 1; }
          # Frontend-Frische verifizieren: build-id.txt wird im Frontend-Stage aus dem
          # GIT_SHA geschrieben. Stimmt sie mit $TAG ueberein, wurde das Frontend fuer
          # DIESEN Commit gebaut (nicht aus altem Layer-Cache). Faengt genau den Bug ab,
          # der #54/#55 unsichtbar machte.
          fe=$(curl -fsS -b /tmp/ck.txt "http://127.0.0.1:18080/build-id.txt" || true)
          [ "$fe" = "$TAG" ] || { echo "FEHLER: Frontend-build-id ist '$fe', erwartet '$TAG' (veralteter Frontend-Build im Image?)"; exit 1; }
          be=$(curl -fsS http://127.0.0.1:18080/healthz | grep -o "\"build\":\"[^\"]*\"" | cut -d'"' -f4)
          [ "$be" = "$TAG" ] || { echo "FEHLER: Backend-build ist '$be', erwartet '$TAG'"; exit 1; }
          echo "Smoke-Test OK (Frontend+Backend build-id = $TAG)"

      - name: Image pushen
        run: docker push "$IMAGE:$TAG"

      - name: Namespace sicherstellen
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Pull-Secret sicherstellen
        run: |
          kubectl -n "$NAMESPACE" create secret docker-registry regcred \
            --docker-server="$REGISTRY" \
            --docker-username="${{ secrets.REGISTRY_USERNAME }}" \
            --docker-password="${{ secrets.REGISTRY_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: App-Secret sicherstellen (anlegen, Platzhalter migrieren, optionale Keys aktivieren)
        env:
          ADMIN_USER_SECRET: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD_SECRET: ${{ secrets.ADMIN_PASSWORD }}
          NOTIFY_TOKEN_SECRET: ${{ secrets.NOTIFY_TOKEN }}
          ANTHROPIC_API_KEY_SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
          POMODORO_TOKEN_SECRET: ${{ secrets.POMODORO_TOKEN }}
        run: |
          set -euo pipefail
          # k8s/15-secret.yaml (Platzhalter admin-password: change-me-before-deploy) wird
          # NICHT angewendet. Dieser Schritt legt organicsr-secrets aus GitHub-Actions-
          # Secrets an; ein bereits mit dem Platzhalter befuelltes Alt-Secret wird auf ein
          # starkes Passwort MIGRIERT (sonst wuerde bei DB-Verlust wieder das bekannte
          # Passwort ausgerollt), und optionale Keys lassen sich nachtraeglich aktivieren.
          # Geheimwerte werden nie geloggt.
          SECRET=organicsr-secrets
          PLACEHOLDER="change-me-before-deploy"
          b64() { printf '%s' "$1" | base64 | tr -d '\n'; }

          if ! kubectl -n "$NAMESPACE" get secret "$SECRET" >/dev/null 2>&1; then
            # ---- Erstanlage ----
            if [ -z "${ADMIN_PASSWORD_SECRET:-}" ]; then
              echo "FEHLER: $SECRET fehlt UND ADMIN_PASSWORD (GitHub-Actions-Secret) ist leer."
              echo "Bitte ein starkes ADMIN_PASSWORD (optional ADMIN_USER/NOTIFY_TOKEN/ANTHROPIC_API_KEY) hinterlegen."
              exit 1
            fi
            kubectl -n "$NAMESPACE" create secret generic "$SECRET" \
              --from-literal=admin-user="${ADMIN_USER_SECRET:-manuel}" \
              --from-literal=admin-password="$ADMIN_PASSWORD_SECRET" \
              --from-literal=notify-token="${NOTIFY_TOKEN_SECRET:-}" \
              --from-literal=anthropic-api-key="${ANTHROPIC_API_KEY_SECRET:-}" \
              --from-literal=pomodoro-token="${POMODORO_TOKEN_SECRET:-}"
            echo "$SECRET erstmalig aus GitHub-Actions-Secrets angelegt."
            exit 0
          fi

          echo "$SECRET existiert - pruefe Platzhalter & optionale Keys (Werte werden NICHT geloggt)."
          # admin-password lesen (nicht ausgeben) und auf Platzhalter/fehlend pruefen.
          STORED_PW="$(kubectl -n "$NAMESPACE" get secret "$SECRET" -o jsonpath='{.data.admin-password}' 2>/dev/null | base64 -d 2>/dev/null || true)"
          if [ -z "$STORED_PW" ] || [ "$STORED_PW" = "$PLACEHOLDER" ]; then
            if [ -z "${ADMIN_PASSWORD_SECRET:-}" ]; then
              echo "FEHLER: $SECRET enthaelt das bekannte Platzhalter-Passwort (oder admin-password fehlt),"
              echo "aber ADMIN_PASSWORD (GitHub-Actions-Secret) ist leer. Bitte ein starkes ADMIN_PASSWORD"
              echo "hinterlegen, damit bei Datenbankverlust kein bekanntes Passwort ausgerollt wird."
              exit 1
            fi
            kubectl -n "$NAMESPACE" patch secret "$SECRET" --type=merge \
              -p "{\"data\":{\"admin-user\":\"$(b64 "${ADMIN_USER_SECRET:-manuel}")\",\"admin-password\":\"$(b64 "$ADMIN_PASSWORD_SECRET")\"}}"
            echo "Platzhalter-Passwort migriert (admin-password aus ADMIN_PASSWORD gesetzt)."
          else
            echo "admin-password ist bereits gesetzt (kein Platzhalter) - unveraendert."
          fi

          # Optionale Keys nachtraeglich aktivieren - nur wenn das jeweilige GH-Secret gesetzt
          # ist. Der spaetere rollout restart laesst den Pod die neuen Werte uebernehmen.
          if [ -n "${NOTIFY_TOKEN_SECRET:-}" ]; then
            kubectl -n "$NAMESPACE" patch secret "$SECRET" --type=merge \
              -p "{\"data\":{\"notify-token\":\"$(b64 "$NOTIFY_TOKEN_SECRET")\"}}"
            echo "notify-token aus GitHub-Actions-Secret aktualisiert."
          fi
          if [ -n "${ANTHROPIC_API_KEY_SECRET:-}" ]; then
            kubectl -n "$NAMESPACE" patch secret "$SECRET" --type=merge \
              -p "{\"data\":{\"anthropic-api-key\":\"$(b64 "$ANTHROPIC_API_KEY_SECRET")\"}}"
            echo "anthropic-api-key aus GitHub-Actions-Secret aktualisiert."
          fi
          if [ -n "${POMODORO_TOKEN_SECRET:-}" ]; then
            kubectl -n "$NAMESPACE" patch secret "$SECRET" --type=merge \
              -p "{\"data\":{\"pomodoro-token\":\"$(b64 "$POMODORO_TOKEN_SECRET")\"}}"
            echo "pomodoro-token aus GitHub-Actions-Secret aktualisiert."
          fi

      - name: Manifeste anwenden
        run: |
          set -euo pipefail
          # Frueher stand hier die Theorie, `apply` auf das Deployment ersetze die Pods
          # nicht. Das war eine FEHLDIAGNOSE: die eigentliche Ursache war ein zweiter
          # Runner mit gleichem Label, der auf einem FALSCHEN Cluster deployte (Prod
          # blieb alt, obwohl CI gruen war). Seit dieser Runner entfernt ist, rollt
          # `apply` sauber aus. Deswegen wird 20-deployment.yaml (Deployment UND
          # Service) jetzt wieder angewendet - sonst rollen strukturelle Aenderungen
          # (Probes, Ressourcen, Volumes, Env, Service) NIE aus und geloeschte
          # Ressourcen lassen sich nicht wiederherstellen.
          # 15-secret bewusst NICHT hier - das App-Secret wird im Schritt davor nur
          # einmalig aus GitHub-Actions-Secrets angelegt (kein Platzhalter-Passwort).
          for f in 00-namespace 10-storage-local 30-ingress 50-cronjob-ntfy; do
            [ -f "k8s/$f.yaml" ] && kubectl -n "$NAMESPACE" apply -f "k8s/$f.yaml"
          done
          # Deployment + Service mit dem AKTUELLEN Image-Tag anwenden (der Platzhalter-
          # Tag aus dem Manifest wird durch $TAG ersetzt, damit apply nicht kurz auf
          # den Platzhalter zurueckrollt).
          sed "s#\(image: ${IMAGE}\):[^[:space:]]*#\1:${TAG}#" k8s/20-deployment.yaml \
            | kubectl -n "$NAMESPACE" apply -f -
          # Belt-and-suspenders: sicherstellen, dass die Spec wirklich den SHA traegt.
          kubectl -n "$NAMESPACE" set image deployment/organicsr organicsr="$IMAGE:$TAG"
          # Verifizieren, dass die Spec den SHA traegt.
          live=$(kubectl -n "$NAMESPACE" get deploy organicsr -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Deployment-Image live: $live"
          case "$live" in
            *":$TAG") echo "Image korrekt gesetzt." ;;
            *) echo "FEHLER: Deployment-Image ist '$live', erwartet Tag '$TAG'"; exit 1 ;;
          esac
          # IMMER einen echten Rollout erzwingen. Wenn die Spec schon auf $TAG steht
          # (z.B. Re-Run desselben Commits), waere `set image` ein No-op und der alte
          # Pod liefe weiter -> `rollout status` meldet instant "success", aber der
          # laufende Pod bleibt alt. `rollout restart` setzt eine restartedAt-Annotation
          # -> neue ReplicaSet -> frischer Pod aus der aktuellen Spec ($TAG). Damit
          # endet Produktion garantiert auf $TAG, unabhaengig vom Ausgangszustand.
          kubectl -n "$NAMESPACE" rollout restart deployment/organicsr

      - name: Rollout abwarten
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status deployment/organicsr --timeout=180s
          # Zusatz-Absicherung: der TATSAECHLICH laufende Pod muss den SHA fahren
          # (nicht nur die Spec / nicht nur rollout-status, der sich schon als
          # unzuverlaessig gezeigt hat).
          running=$(kubectl -n "$NAMESPACE" get pods -l app=organicsr \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].spec.containers[0].image}' 2>/dev/null || true)
          echo "Laufender Pod: $running"
          case "$running" in
            *":$TAG") echo "Laufender Pod faehrt $TAG." ;;
            *) echo "FEHLER: laufender Pod ist '$running', erwartet '$TAG'"; exit 1 ;;
          esac

      # Prueft die OEFFENTLICHE URL ueber HTTPS - OHNE -k, damit ein ungueltiges
      # Zertifikat (Traefik-Default-Cert) fehlschlaegt. Faengt Ingress-/TLS-Regressionen
      # ab, die den Login unbrauchbar machen (der Container-Smoke-Test allein sieht das nicht).
      - name: Live-Check (oeffentliches HTTPS + gueltiges Zertifikat)
        run: |
          set -euo pipefail
          ok=""
          for i in $(seq 1 10); do
            if curl -fsS "$PUBLIC_URL/healthz" >/dev/null 2>&1; then ok=1; break; fi
            sleep 6
          done
          [ -n "$ok" ] || { echo "FEHLER: $PUBLIC_URL/healthz nicht erreichbar oder Zertifikat ungueltig"; exit 1; }
          # Verifizieren, dass PRODUKTION wirklich DIESEN Commit faehrt. Haette den
          # stillen "Deploy gruen, aber alte UI"-Bug (#54/#55) sofort rot gemacht:
          # Pods rollen nicht / altes Image / veraltetes Frontend -> build != $TAG.
          live=""
          for i in $(seq 1 15); do
            b=$(curl -fsS "$PUBLIC_URL/healthz" | grep -o "\"build\":\"[^\"]*\"" | cut -d'"' -f4 || true)
            if [ "$b" = "$TAG" ]; then live=1; break; fi
            sleep 4
          done
          [ -n "$live" ] || { echo "FEHLER: Produktion faehrt build '$b', erwartet '$TAG' (Rollout/Image/Frontend veraltet?)"; exit 1; }
          echo "Live-Check OK: $PUBLIC_URL faehrt build $TAG mit gueltigem Zertifikat"

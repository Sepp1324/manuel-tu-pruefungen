name: build-and-deploy

on:
  push:
    branches: [main]

concurrency:
  group: organicsr-deploy-vps-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/sepp1324/manuel-tu-pruefungen
  KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  NAMESPACE: organicsr

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: [self-hosted, k3s-vps]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image-Tag = Git-SHA
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Bei GHCR anmelden
        run: echo "${{ github.token }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Image bauen
        run: docker build -t "$IMAGE:$TAG" .

      - name: Image pushen
        run: docker push "$IMAGE:$TAG"

      - name: Namespace sicherstellen
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Manifeste anwenden
        run: |
          kubectl -n "$NAMESPACE" apply -k k8s
          kubectl -n "$NAMESPACE" set image deployment/organicsr organicsr="$IMAGE:$TAG"

      - name: Rollout abwarten
        run: kubectl -n "$NAMESPACE" rollout status deployment/organicsr --timeout=180s

# SQLite-Datenbank auf der Synology via NFS.
#
# Voraussetzung auf der Synology (DSM):
#   1. Freigabe anlegen, z. B. /volume1/k3s/organicsr
#   2. Systemsteuerung -> Dateidienste -> NFS aktivieren
#   3. Freigabe -> Berechtigungen -> NFS-Berechtigungen:
#        - Client: 192.168.1.0/24 (bzw. dein VLAN30-Range)
#        - Squash:   "Kein Mapping" (No mapping)  -> sonst schreibt SQLite nicht
#        - Rechte:   Lesen/Schreiben
#        - Security: sys
#   4. Verzeichnis muss von der NFS-UID beschreibbar sein.
#
# Hinweis SQLite + NFS: WAL-Locking über NFS kann zickig sein. Wir stellen den
# Pod deshalb auf journal_mode über Umgebung sicher NICHT auf WAL um, sondern
# lassen SQLite auf einem einzelnen Replica laufen (siehe Deployment: replicas=1,
# strategy=Recreate). Damit gibt es nie zwei gleichzeitige Writer.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: organicsr-nfs-pv
  labels:
    app: organicsr
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-organicsr
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
  nfs:
    server: 192.168.1.101          # Synology NAS
    path: /volume1/k3s/organicsr   # angelegte NFS-Freigabe anpassen
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: organicsr-data
  namespace: organicsr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-organicsr
  resources:
    requests:
      storage: 2Gi
  volumeName: organicsr-nfs-pv

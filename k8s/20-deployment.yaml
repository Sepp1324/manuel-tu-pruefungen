# Image-Referenz: an deine Registry anpassen.
# Beispiel: registry.stoegerer-home.cloud/organicsr:1.0.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organicsr
  namespace: organicsr
  labels:
    app: organicsr
spec:
  replicas: 1                 # SQLite -> genau EIN Writer. Nicht hochskalieren.
  strategy:
    type: Recreate           # alten Pod erst beenden, dann neuen -> nie zwei Writer auf der DB
  selector:
    matchLabels:
      app: organicsr
  template:
    metadata:
      labels:
        app: organicsr
    spec:
      # Zugangsdaten zum Pullen aus der privaten Registry. Das Secret 'regcred'
      # wird vom CI-Workflow aus den GitHub-Secrets erzeugt (siehe deploy-k3s.yml).
      imagePullSecrets:
        - name: regcred
      containers:
        - name: organicsr
          image: registry.stoegerer-home.cloud/organicsr:1.0.0   # <-- ANPASSEN
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # SQLite auf lokalem Node-Storage. Fuer PostgreSQL + Redis (optional)
            # DATABASE_URL/REDIS_URL setzen -> siehe README. Standard: SQLite.
            - name: SR_DB_PATH
              value: /data/organicsr.db
            - name: SR_JOURNAL_MODE
              value: "WAL"
            # --- Authentifizierung ---
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: organicsr-secrets
                  key: admin-user
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: organicsr-secrets
                  key: admin-password
            # Öffentlich hinter HTTPS -> Session-Cookie nur über TLS senden.
            - name: AUTH_COOKIE_SECURE
              value: "1"
            # Optional: Token fuer /api/notify/digest (taegliche ntfy-Erinnerung).
            # Leer lassen -> Digest-Endpunkt bleibt gesperrt (Feature aus).
            - name: NOTIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: organicsr-secrets
                  key: notify-token
                  optional: true
            # Optional: KI-Antwortbewertung + Coach. Ohne Key -> Stichwort-Naeherung.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: organicsr-secrets
                  key: anthropic-api-key
                  optional: true
          # Readiness prueft die DB (/readyz, mit Schreib-Ping) - bei gesperrter/korrupter/
          # read-only DB wird der Pod aus dem Service genommen, statt weiter 500er zu liefern.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: organicsr-data-local
---
apiVersion: v1
kind: Service
metadata:
  name: organicsr
  namespace: organicsr
  labels:
    app: organicsr
spec:
  selector:
    app: organicsr
  ports:
    - name: http
      port: 80
      targetPort: http

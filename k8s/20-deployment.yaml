# Image-Referenz: an deine Registry anpassen.
# Beispiel: registry.stoegerer-home.at/organicsr:1.0.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organicsr
  namespace: organicsr
  labels:
    app: organicsr
spec:
  replicas: 1                 # Ein Nutzer -> eine Replica reicht. Seeding laeuft
                              # ohne Startup-Lock, daher nicht ohne Weiteres hochskalieren.
  strategy:
    type: Recreate           # alten Pod erst beenden, dann neuen
  selector:
    matchLabels:
      app: organicsr
  template:
    metadata:
      labels:
        app: organicsr
    spec:
      containers:
        - name: organicsr
          image: registry.stoegerer-home.at/organicsr:1.0.0   # <-- ANPASSEN
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # --- PostgreSQL + Redis ---
            # DATABASE_URL leer lassen -> Fallback auf SQLite (SR_DB_PATH).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: organicsr-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://organicsr:$(POSTGRES_PASSWORD)@organicsr-db:5432/organicsr"
            - name: REDIS_URL
              value: "redis://organicsr-redis:6379/0"
            - name: SR_DB_PATH
              value: /data/organicsr.db
            - name: SR_JOURNAL_MODE
              value: "WAL"
            # --- Authentifizierung ---
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: organicsr-secrets
                  key: admin-user
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: organicsr-secrets
                  key: admin-password
            # Öffentlich hinter HTTPS -> Session-Cookie nur über TLS senden.
            - name: AUTH_COOKIE_SECURE
              value: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: organicsr-data-local
---
apiVersion: v1
kind: Service
metadata:
  name: organicsr
  namespace: organicsr
  labels:
    app: organicsr
spec:
  selector:
    app: organicsr
  ports:
    - name: http
      port: 80
      targetPort: http

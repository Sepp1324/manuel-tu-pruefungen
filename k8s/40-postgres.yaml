# PostgreSQL fuer den organicsr-Trainer.
# Ein-Instanz-Deployment mit eigener PVC (local-path). Recreate-Strategie, damit
# nie zwei Postgres-Pods gleichzeitig auf dasselbe Datenverzeichnis schreiben.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: organicsr-pgdata
  namespace: organicsr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organicsr-db
  namespace: organicsr
  labels:
    app: organicsr-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: organicsr-db
  template:
    metadata:
      labels:
        app: organicsr-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: organicsr
            - name: POSTGRES_DB
              value: organicsr
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: organicsr-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "organicsr", "-d", "organicsr"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "organicsr", "-d", "organicsr"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: organicsr-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: organicsr-db
  namespace: organicsr
  labels:
    app: organicsr-db
spec:
  selector:
    app: organicsr-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

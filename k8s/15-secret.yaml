# ACHTUNG: Diese Datei ist nur eine VORLAGE und wird vom CI-Workflow NICHT mehr
# angewendet (sonst wuerde bei neuer/verlorener DB ein oeffentlicher Benutzer mit
# dem bekannten Platzhalter-Passwort angelegt). Der Deploy legt organicsr-secrets
# stattdessen EINMALIG aus GitHub-Actions-Secrets an (ADMIN_PASSWORD etc.).
# Zum manuellen Anlegen die Werte unten ersetzen und selbst `kubectl apply`en.
#
# Der Admin-Benutzer wird beim ERSTEN Start angelegt (nur wenn noch kein Konto
# existiert). Weitere Konten / Passwortwechsel danach direkt in der App.
# Erzeuge ein starkes Passwort, z. B.:  openssl rand -base64 18
#
apiVersion: v1
kind: Secret
metadata:
  name: organicsr-secrets
  namespace: organicsr
type: Opaque
stringData:
  admin-user: "manuel"
  admin-password: "change-me-before-deploy"
  # Optional – nur setzen, wenn gewuenscht (sonst Feature einfach aus):
  # notify-token:      "<openssl rand -hex 16>"   # aktiviert /api/notify/digest fuer den ntfy-CronJob
  # anthropic-api-key: "<sk-ant-...>"             # aktiviert KI-Antwortbewertung + Coach

# Redis-Cache fuer den organicsr-Trainer.
# Reiner Cache (kein Persist): faellt der Pod aus, rechnet die App die Antworten
# einfach neu (cache.py faellt closed auf In-Memory zurueck). Daher keine PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: organicsr-redis
  namespace: organicsr
  labels:
    app: organicsr-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: organicsr-redis
  template:
    metadata:
      labels:
        app: organicsr-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 160Mi
---
apiVersion: v1
kind: Service
metadata:
  name: organicsr-redis
  namespace: organicsr
  labels:
    app: organicsr-redis
spec:
  selector:
    app: organicsr-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

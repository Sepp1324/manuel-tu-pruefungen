# Topologie (IST-Zustand): DNS chemie.stoegerer-home.cloud -> Traefik (LB-IP) -> App.
#
# Der oeffentliche DNS-Eintrag zeigt DIREKT auf Traefik, nicht auf einen davor
# liegenden Caddy. Deshalb MUSS Traefik selbst TLS terminieren - sonst antwortet
# der websecure-Entrypoint (443) mit dem Traefik-Default-Zertifikat und 404, und
# HTTPS (und damit der Login, der ein Secure-Cookie setzt) ist komplett kaputt.
#
# Das TLS-Zertifikat liefert cert-manager im Secret `organicsr-tls`. Die dafuer
# noetigen Ressourcen (ClusterIssuer + Certificate) liegen in k8s/bootstrap/ und
# werden pro Cluster einmalig angewandt (siehe k8s/README.md). Hier wird das
# Secret nur referenziert - die Erneuerung laeuft ueber cert-manager.
#
# WICHTIG: Diese Datei NICHT auf die reine web-only-Variante zuruecksetzen -
# ein `apply -k` wuerde sonst erneut die TLS-Sektion aus dem Live-Ingress
# entfernen und HTTPS wieder abschiessen.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: organicsr
  namespace: organicsr
  annotations:
    # web = Port 80 (u.a. cert-manager HTTP-01 Renewal), websecure = Port 443 (TLS)
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - chemie.stoegerer-home.cloud
      secretName: organicsr-tls
  rules:
    - host: chemie.stoegerer-home.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: organicsr
                port:
                  number: 80

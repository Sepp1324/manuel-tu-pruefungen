
# Topologie: Caddy (öffentlich, terminiert TLS) -> Traefik (HTTP, web) -> App.
#
# Da Caddy TLS terminiert und per HTTP an Traefik weitergibt, DARF Traefik KEINEN
# http->https-Redirect machen — sonst Endlosschleife ("Load cannot follow more
# than 20 redirections"). TLS und der http->https-Redirect gehören zu Caddy.
#
# Deshalb: EINE Ingress, nur web-Entrypoint, KEIN TLS, KEIN Redirect.
#
# Caddyfile-Block auf dem Caddy-Host (kein manuelles 'redir' — Caddy leitet
# http->https automatisch um):
#
#   chemie-manuel.stoegerer-home.at {
#       reverse_proxy <TRAEFIK-LB-IP>:80
#   }
#
# <TRAEFIK-LB-IP> = kubectl -n kube-system get svc traefik  (EXTERNAL-IP)
#
# Hinweis: In dieser Variante wird cert-manager/05-cluster-issuer.yaml NICHT
# benötigt (Caddy stellt das Zertifikat). Ist cert-manager nicht installiert,
# 05-cluster-issuer.yaml aus kustomization.yaml entfernen.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: organicsr
  namespace: organicsr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: chemie-manuel.stoegerer-home.at   # <-- ANPASSEN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: organicsr
                port:
                  number: 80

# Let's-Encrypt-Issuer (Produktion) mit HTTP-01-Challenge ueber den Traefik-Ingress.
# Cluster-weit (ClusterIssuer) - einmal pro Cluster anlegen, NICHT bei jedem Deploy.
#
# WICHTIG: email MUSS auf eine echte Adresse gesetzt werden, sonst lehnt Let's Encrypt
# die ACME-Registrierung ab und es wird kein Zertifikat ausgestellt.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: CHANGE-ME@example.com   # <-- VOR DEM ANWENDEN SETZEN
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik

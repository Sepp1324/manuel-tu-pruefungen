# Einmaliges Cluster-Bootstrap fuer TLS (ClusterIssuer + Certificate).
# BEWUSST getrennt von der Haupt-Kustomization: der Deploy-Workflow laeuft
# `apply -k k8s` bei jedem Push - ein cluster-weiter Issuer darf da nicht
# mitlaufen (Risiko, die laufende Zertifikatserneuerung zu stoeren).
#
# Anwenden pro Cluster genau einmal (Voraussetzung: cert-manager installiert,
# Namespace organicsr existiert, DNS zeigt auf Traefik):
#   kubectl apply -k k8s/bootstrap
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 05-cluster-issuer.yaml
  - 25-certificate.yaml

# SQLite-Datenbank auf Longhorn.
#
# SQLite bleibt bei replicas=1 + Recreate, damit nie zwei Pods gleichzeitig in
# dieselbe DB schreiben. Longhorn gibt uns Replikation und Node-Failover fuer
# das Volume, ersetzt aber kein Backup.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: organicsr-data-local
  namespace: organicsr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
